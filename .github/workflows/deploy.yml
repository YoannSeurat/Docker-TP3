name: Deploy with Ansible

on:
  push:
    paths:
      - 'backend/**'
      - 'ansible/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'admin' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: POSTGRES_PASSWORD
          script_stop: true
          script: |
            set -eu
            cd ~/docker/TP3
            git pull --ff-only
            cd ansible
            ansible-galaxy collection install -r requirements.yml
            export SERVER_HOST=localhost
            export ANSIBLE_CONNECTION=local
            ansible-playbook --syntax-check -i inventories/setup.yml playbook.yml
            ansible-playbook -i inventories/setup.yml playbook.yml \
              -e "ansible_host=$SERVER_HOST" \
              -e "ansible_connection=$ANSIBLE_CONNECTION" \
              -e "database_password=$POSTGRES_PASSWORD"
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
