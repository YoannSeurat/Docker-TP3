---
all:
  children:
    prod:
      hosts:
        server:
          ansible_host: "{{ lookup('env', 'SERVER_HOST') | default('yoann.seurat.takima.school', true) }}"
          ansible_user: "{{ lookup('env', 'ANSIBLE_USER') | default('admin', true) }}"
          ansible_connection: "{{ lookup('env', 'ANSIBLE_CONNECTION') | default('ssh', true) }}"