---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - python3-venv
    state: present
    update_cache: false

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Docker repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Find legacy Docker repository files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*docker*.list"
      - "*docker*.sources"
    file_type: file
  register: docker_repository_files

- name: Remove legacy Docker repository files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_repository_files.files }}"

- name: Remove legacy Docker entries from the main APT sources file
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: "^[^#].*download\\.docker\\.com.*$"
    state: absent

- name: Configure Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts.architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and CLI
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce
      - docker-ce-cli
      - docker-buildx-plugin
    state: present

- name: Create Python virtual environment for Docker SDK
  ansible.builtin.command:
    cmd: python3 -m venv /opt/docker_venv
    creates: /opt/docker_venv/bin/python3

- name: Install Docker SDK in the virtual environment
  ansible.builtin.pip:
    name: docker
    virtualenv: /opt/docker_venv
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
