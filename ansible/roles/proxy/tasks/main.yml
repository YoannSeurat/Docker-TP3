---
# tasks file for roles/proxy

- name: Launch proxy
  community.docker.docker_container:
    name: httpd
    image: httpd:2.4
    networks:
      - name: myapp-network
    published_ports:
      - "80:80"
    state: started
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python3
